name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/prices
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --isolated --only-binary=vnstock --index-url https://pypi.org/simple -c apps/api/constraints-vnstock.txt -e "apps/api[dev]"
      - name: Run loopback TLS canary self-check
        run: bash scripts/oracle/lb_canary_tls_selfcheck.sh
      - name: Run root CI gate
        run: pnpm run ci:gate

  postgres-release-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vnibb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vnibb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vnibb
      POSTGRES_CONTRACT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/vnibb
      POSTGRES_CONTRACT: "1"
      SKIP_SCHEDULER_STARTUP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --isolated --only-binary=vnstock --index-url https://pypi.org/simple -c apps/api/constraints-vnstock.txt -e "apps/api[dev]"
      - name: Apply migrations to an empty PostgreSQL database
        working-directory: apps/api
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run PostgreSQL release contracts
        run: python -m pytest apps/api/tests/test_contract -q

  chromium-release-smoke:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000/api/v1/ws/prices
      NEXT_PUBLIC_ENABLE_REALTIME: "false"
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:////tmp/vnibb-release-smoke.db
      DATABASE_URL_SYNC: sqlite+aiosqlite:////tmp/vnibb-release-smoke.db
      REDIS_URL: ""
      REDIS_HOST: ""
      REDIS_PORT: "0"
      MONGODB_ENABLED: "false"
      SKIP_SCHEDULER_STARTUP: "1"
      SKIP_WEBSOCKET_STARTUP: "1"
      SKIP_WARMUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install API dependencies for local smoke service
        run: |
          python -m pip install --upgrade pip
          pip install --isolated --only-binary=vnstock --index-url https://pypi.org/simple -c apps/api/constraints-vnstock.txt -e "apps/api[dev]"
      - name: Install Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Run Chromium release smoke
        run: pnpm --filter frontend test:e2e:smoke

  # #202: the app smoke and brand specs must pass on all three engines, not only
  # on chromium. chromium-release-smoke above stays the required check; this job
  # is additive and runs the same spec files (no new specs) per engine.
  engine-release-smoke:
    needs: chromium-release-smoke
    strategy:
      fail-fast: false
      matrix:
        # Brand specs reuse their own config, which already declares all three
        # engines, so this matrix covers both spec sets per engine.
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000/api/v1/ws/prices
      NEXT_PUBLIC_ENABLE_REALTIME: "false"
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:////tmp/vnibb-release-smoke.db
      DATABASE_URL_SYNC: sqlite+aiosqlite:////tmp/vnibb-release-smoke.db
      REDIS_URL: ""
      REDIS_HOST: ""
      REDIS_PORT: "0"
      MONGODB_ENABLED: "false"
      SKIP_SCHEDULER_STARTUP: "1"
      SKIP_WEBSOCKET_STARTUP: "1"
      SKIP_WARMUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install API dependencies for local smoke service
        run: |
          python -m pip install --upgrade pip
          pip install --isolated --only-binary=vnstock --index-url https://pypi.org/simple -c apps/api/constraints-vnstock.txt -e "apps/api[dev]"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.engine }}-
      # Same install form as chromium-release-smoke; only the engine differs.
      - name: Install ${{ matrix.engine }}
        run: pnpm --filter frontend exec playwright install --with-deps ${{ matrix.engine }}
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Run ${{ matrix.engine }} smoke specs
        run: pnpm --filter frontend exec playwright test --project=${{ matrix.engine }}
      # Brand config has no webServer of its own and defaults to :3101, so the
      # production bundle is served there explicitly and PW_BASE_URL pins it.
      - name: Start frontend on :3101 for brand specs
        working-directory: apps/web
        run: |
          CI=1 nohup pnpm exec next start -p 3101 > /tmp/brand-3101.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3101/login; then exit 0; fi
            sleep 2
          done
          cat /tmp/brand-3101.log
          exit 1
      - name: Run ${{ matrix.engine }} brand specs
        env:
          PW_BASE_URL: http://127.0.0.1:3101
        run: pnpm --filter frontend exec playwright test --config=playwright.brand.config.ts --project=${{ matrix.engine }}

  vnstock-wheel-resolution:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up target Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API dependencies from the platform wheel lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --isolated --only-binary=vnstock --index-url https://pypi.org/simple -c apps/api/constraints-vnstock.txt -e "apps/api[dev]"
      - name: Verify credential-free publisher wheel resolution
        run: python -m pytest apps/api/scripts/test_vnstock_install.py -q

  vnstock-target-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build credential-free target image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: false
          build-args: IMAGE_RELEASE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=vnstock5-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=vnstock5-${{ matrix.architecture }}
