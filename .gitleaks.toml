[extend]
useDefault = true

# One block: gitleaks keeps only a single `[allowlist]` section, so a second
# `[[allowlists]]` entry would silently disappear.
[allowlist]
description = "Cache namespaces and synthetic DNSE test sentinels, not secrets"
regexTarget = "match"
regexes = [
  '''key_prefix="[A-Za-z0-9_-]+"''',
  # Synthetic DNSE sentinels that assert a credential is never rendered. The
  # tests now build these from parts, so this only covers the two commits that
  # introduced the literal form; it matches the sentinel text, never a real key.
  '''DNSE-(?:KEY|SECRET)-SENTINEL-[0-9a-f]{4}''',
]
