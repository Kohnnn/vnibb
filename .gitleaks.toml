[extend]
useDefault = true

[allowlist]
description = "cached() decorator key_prefix args are cache namespaces, not secrets"
regexTarget = "match"
regexes = [
  '''key_prefix="[A-Za-z0-9_-]+"''',
]

[[rules]]
id = "vnibb-provider-credentials"
description = "DNSE and Finhay API credential assignments"
regex = '''(?im)(?:^[ \t]*(?:export[ \t]+)?(?:DNSE|FINHAY)_API_(?:KEY|SECRET)[ \t]*[:=][ \t]*(?:"(?:\\[^\r\n]|[^"\\\r\n])+"|'[^'\r\n]+'|[^\s"'`#][^\s"'`]*)[ \t]*(?:\#.*)?$|["'](?:DNSE|FINHAY)_API_(?:KEY|SECRET)["'][ \t]*:[ \t]*(?:"(?:\\[^\r\n]|[^"\\\r\n])+"|'[^'\r\n]+'))'''
keywords = ["dnse_api_", "finhay_api_"]
