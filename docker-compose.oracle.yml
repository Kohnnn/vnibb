x-docker-logging: &docker-logging
  driver: ${DOCKER_LOG_DRIVER:-local}
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  api:
    image: ${VNIBB_API_IMAGE_REPOSITORY:?Set VNIBB_API_IMAGE_REPOSITORY in deployment/env.oracle}@${VNIBB_API_IMAGE_DIGEST:?Set VNIBB_API_IMAGE_DIGEST to the published sha256 digest.}
    container_name: vnibb-api
    hostname: vnibb-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./deployment/env.oracle
        required: false
    environment:
      PORT: ${PORT:-8000}
      UVICORN_PROXY_HEADERS: ${UVICORN_PROXY_HEADERS:-1}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      INTRADAY_MARKET_TZ: ${INTRADAY_MARKET_TZ:-Asia/Ho_Chi_Minh}
      SCHEDULER_ROLE: api
      SKIP_SCHEDULER_STARTUP: ${API_SKIP_SCHEDULER_STARTUP:-true}
    expose:
      - "8000"
    volumes:
      - vnibb_api_logs:/app/logs
    cpus: ${API_CPUS:-1.50}
    mem_limit: ${API_MEM_LIMIT:-4g}
    pids_limit: ${API_PIDS_LIMIT:-256}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8000}/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  scheduler:
    image: ${VNIBB_API_IMAGE_REPOSITORY:?Set VNIBB_API_IMAGE_REPOSITORY in deployment/env.oracle}@${VNIBB_API_IMAGE_DIGEST:?Set VNIBB_API_IMAGE_DIGEST to the published sha256 digest.}
    container_name: vnibb-scheduler
    hostname: vnibb-scheduler
    restart: unless-stopped
    profiles: ["scheduler"]
    env_file:
      - path: ./deployment/env.oracle
        required: false
    environment:
      SCHEDULER_ROLE: scheduler
      SKIP_SCHEDULER_STARTUP: "false"
      SKIP_WEBSOCKET_STARTUP: "true"
      SCHEDULER_LOCK_ENABLED: "true"
      SCHEDULER_LOCK_MODE: required
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      INTRADAY_MARKET_TZ: ${INTRADAY_MARKET_TZ:-Asia/Ho_Chi_Minh}
    command: ["python", "-m", "vnibb.scheduler_worker"]
    volumes:
      - vnibb_api_logs:/app/logs
    cpus: ${SCHEDULER_CPUS:-1.00}
    mem_limit: ${SCHEDULER_MEM_LIMIT:-2g}
    pids_limit: ${SCHEDULER_PIDS_LIMIT:-256}
    logging: *docker-logging
    healthcheck:
      test: ["CMD", "python", "-m", "vnibb.scheduler_worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mcp:
    image: ${VNIBB_API_IMAGE_REPOSITORY:?Set VNIBB_API_IMAGE_REPOSITORY in deployment/env.oracle}@${VNIBB_API_IMAGE_DIGEST:?Set VNIBB_API_IMAGE_DIGEST to the published sha256 digest.}
    container_name: vnibb-mcp
    hostname: vnibb-mcp
    restart: unless-stopped
    env_file:
      - path: ./deployment/env.oracle
        required: false
    environment:
      VNIBB_MCP_HOST: ${VNIBB_MCP_HOST:-0.0.0.0}
      VNIBB_MCP_PORT: ${VNIBB_MCP_PORT:-8001}
      VNIBB_MCP_TRANSPORT: ${VNIBB_MCP_TRANSPORT:-streamable-http}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      INTRADAY_MARKET_TZ: ${INTRADAY_MARKET_TZ:-Asia/Ho_Chi_Minh}
    command: ["python", "-m", "vnibb.mcp.server"]
    expose:
      - "8001"
    ports:
      - "${MCP_PUBLIC_BIND:-127.0.0.1}:${MCP_PUBLIC_PORT:-8001}:8001"
    cpus: ${MCP_CPUS:-0.50}
    mem_limit: ${MCP_MEM_LIMIT:-1g}
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    image: ${VNIBB_API_IMAGE_REPOSITORY:?Set VNIBB_API_IMAGE_REPOSITORY in deployment/env.oracle}@${VNIBB_API_IMAGE_DIGEST:?Set VNIBB_API_IMAGE_DIGEST to the published sha256 digest.}
    restart: "no"
    env_file:
      - path: ./deployment/env.oracle
        required: false
    entrypoint: ["alembic"]
    command: ["-c", "/app/alembic.ini", "upgrade", "head"]

  caddy:
    image: caddy:2.8-alpine
    container_name: vnibb-caddy
    hostname: vnibb-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ./deployment/env.oracle
        required: false
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?Set SITE_HOSTNAME in deployment/env.oracle and pass --env-file deployment/env.oracle}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-auth:9999}
      MCP_UPSTREAM: ${MCP_UPSTREAM:-mcp:8001}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deployment/env.oracle and pass --env-file deployment/env.oracle}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpus: ${CADDY_CPUS:-0.50}
    mem_limit: ${CADDY_MEM_LIMIT:-512m}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    logging: *docker-logging

  db:
    image: supabase/postgres:17.6.1.136
    container_name: vnibb-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/env.oracle}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - vnibb_postgres:/var/lib/postgresql/data
    cpus: ${POSTGRES_CPUS:-1.00}
    mem_limit: ${POSTGRES_MEM_LIMIT:-3g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  mongo:
    image: mongo:7
    container_name: vnibb-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in deployment/env.oracle}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in deployment/env.oracle}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - vnibb_mongo:/data/db
    cpus: ${MONGO_CPUS:-1.00}
    mem_limit: ${MONGO_MEM_LIMIT:-3g}
    pids_limit: ${MONGO_PIDS_LIMIT:-256}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: vnibb-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deployment/env.oracle}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --save 60 1000"]
    volumes:
      - vnibb_redis:/data
    cpus: ${REDIS_CPUS:-0.50}
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  auth:
    image: supabase/gotrue:v2.177.0
    container_name: vnibb-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: ${SUPABASE_URL:?Set SUPABASE_URL in deployment/env.oracle}/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: ${GOTRUE_DB_DATABASE_URL:?Set GOTRUE_DB_DATABASE_URL in deployment/env.oracle}
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-https://vnibb-web.vercel.app}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-https://vnibb-web.vercel.app/**}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in deployment/env.oracle}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "9999"
    cpus: ${AUTH_CPUS:-0.50}
    mem_limit: ${AUTH_MEM_LIMIT:-512m}
    pids_limit: ${AUTH_PIDS_LIMIT:-128}
    logging: *docker-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  vnibb_api_logs:
  vnibb_postgres:
  vnibb_mongo:
  vnibb_redis:
  caddy_data:
  caddy_config:
